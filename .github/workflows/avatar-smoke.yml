name: Game smoke tests
on:
  push:
    branches: [codex/game-recovery]
  pull_request:
    branches: [main]
jobs:
  avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/avatar-eyewear.test.mjs tests/avatar-png-registry.test.mjs tests/avatar-png-options.test.mjs tests/questions-integrity.test.mjs
