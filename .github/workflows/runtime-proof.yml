name: Runtime proof
on:
  push:
    branches: [main, codex/game-recovery, codex/avatar-preview-refresh-20261011, codex/preview-staging-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Prove Node execution
        run: node --version
      - name: Validate isolated staging config on staging branch
        if: github.ref == 'refs/heads/codex/preview-staging-20261011' || github.head_ref == 'codex/preview-staging-20261011'
        env:
          STAGING_D1_DATABASE_ID: 12345678-1234-4234-8234-123456789abc
          STAGING_WORKER_NAME: coop-ai-game-test-staging
        run: |
          bash scripts/configure-staging.sh
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('.staging-local/wrangler.staging.json','utf8'));
          assert.equal(config.name,'coop-ai-game-test-staging');
          assert.equal(config.d1_databases[0].database_id,process.env.STAGING_D1_DATABASE_ID);
          assert.equal(config.d1_databases[0].remote,true);
          assert.equal(config.routes,undefined);
          assert.equal(config.route,undefined);
          console.log('Staging isolation check passed.');
          NODE
          git check-ignore .staging-local/wrangler.staging.json
      - name: Exercise validator CLI
        run: node scripts/validate-avatar-production-glb.mjs --self-test
  recovered-tests:
    needs: node-validator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Verify project package manager
        run: |
          node -e "const p=require('./package.json'); if(p.packageManager!=='pnpm@11.25.0')throw new Error('Unexpected packageManager');"
          corepack pnpm --version
      - name: Install locked dependencies
        id: install
        run: corepack pnpm install --frozen-lockfile
      - name: Test question bank regression
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/questions-regression.test.mjs
      - name: Test game rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --experimental-transform-types --test server/game.test.ts
      - name: Test game integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/test-game-integration.mjs
      - name: Test avatar renderer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/test-avatar-renderer.mjs
      - name: Test avatar persistence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/test-avatar-recovery.mjs
  asset-access-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read official character download links
        run: python3 scripts/discover-avatar-assets.py
