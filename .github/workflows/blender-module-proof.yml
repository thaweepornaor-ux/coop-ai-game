name: Blender module proof
on:
  push:
    branches: [main, codex/game-recovery]
    paths:
      - 'scripts/ci-prove-bpy.py'
      - '.github/workflows/blender-module-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blender-module-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove-official-bpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prepare isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/bpy-runtime"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m py_compile scripts/ci-prove-bpy.py
      - name: Download reviewed official wheel
        run: |
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: bpy==4.5.9 --dest "$RUNNER_TEMP/bpy-wheel"
      - name: Verify wheel and prove Blender module execution
        run: |
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/ci-prove-bpy.py --wheel-dir "$RUNNER_TEMP/bpy-wheel" --out bpy-proof
      - name: Preserve Blender module evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blender-module-proof
          path: bpy-proof/
          if-no-files-found: ignore
          retention-days: 14
