name: Test one offline Snow native-rotation CUBICSPLINE candidate
on:
  push:
    branches: [codex/game-recovery]
    paths:
      - 'scripts/ci-restore-frozen-avatar-sources.py'
      - 'scripts/ci-restore-snow-factor48-input.py'
      - 'scripts/ci-restore-snow-rotation-packet0.py'
      - 'scripts/ci-restore-snow-rotation-packet1.py'
      - 'scripts/ci-export-snow-native-rotation-cubic.py'
      - 'scripts/avatar_glb_native_rotation_reader.py'
      - 'scripts/avatar-render-configs/snow-native-rotation-derivative-plan.json'
      - '.github/workflows/avatar-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snow-native-rotation-cubic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile and restore the frozen factor48 input and both complete capture packets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/ci-restore-frozen-avatar-sources.py scripts/ci-restore-snow-factor48-input.py scripts/ci-restore-snow-rotation-packet0.py scripts/ci-restore-snow-rotation-packet1.py scripts/ci-export-snow-native-rotation-cubic.py scripts/avatar_glb_native_rotation_reader.py
          python scripts/ci-restore-snow-factor48-input.py --out "$RUNNER_TEMP/avatar-factor48-input" --report "$RUNNER_TEMP/avatar-native-rotation-cubic/frozen-factor48-input-restore.json"
          python scripts/ci-restore-snow-rotation-packet0.py --out "$RUNNER_TEMP/avatar-rotation-packet0" --report "$RUNNER_TEMP/avatar-native-rotation-cubic/frozen-rotation-packet0-restore.json"
          python scripts/ci-restore-snow-rotation-packet1.py --out "$RUNNER_TEMP/avatar-rotation-packet1" --report "$RUNNER_TEMP/avatar-native-rotation-cubic/frozen-rotation-packet1-restore.json"
      - name: Prepare pinned NumPy only without Blender or original source restoration
        run: |
          python -m venv "$RUNNER_TEMP/numpy-runtime"
          "$RUNNER_TEMP/numpy-runtime/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: numpy==1.26.4
      - name: Repack exactly one rotation-only candidate from the frozen native packets
        run: |
          "$RUNNER_TEMP/numpy-runtime/bin/python" scripts/ci-export-snow-native-rotation-cubic.py --source-root "$RUNNER_TEMP/avatar-factor48-input/checkpoint" --packet0-root "$RUNNER_TEMP/avatar-rotation-packet0/checkpoint" --packet1-root "$RUNNER_TEMP/avatar-rotation-packet1/checkpoint" --plan scripts/avatar-render-configs/snow-native-rotation-derivative-plan.json --out "$RUNNER_TEMP/avatar-native-rotation-cubic/snow"
      - name: Independently check actual GLB bytes,native tangents,291 keys,old24 and fresh24
        run: |
          "$RUNNER_TEMP/numpy-runtime/bin/python" scripts/avatar_glb_native_rotation_reader.py --glb "$RUNNER_TEMP/avatar-native-rotation-cubic/snow/snow-armature-native-rotation-cubic-prototype.glb" --reference-json "$RUNNER_TEMP/avatar-native-rotation-cubic/snow/native_reference.json" --native-npz "$RUNNER_TEMP/avatar-native-rotation-cubic/snow/native_reference.npz" --source-glb "$RUNNER_TEMP/avatar-factor48-input/checkpoint/source.glb" --packet0-root "$RUNNER_TEMP/avatar-rotation-packet0/checkpoint" --packet1-root "$RUNNER_TEMP/avatar-rotation-packet1/checkpoint" --plan scripts/avatar-render-configs/snow-native-rotation-derivative-plan.json --out "$RUNNER_TEMP/avatar-native-rotation-cubic/snow"
      - name: Preserve the actual candidate,frozen references,capture packets and credits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-native-rotation-cubic-candidate
          path: ${{ runner.temp }}/avatar-native-rotation-cubic/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Preserve small JSON proof and three original credits without GLB or NPZ
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-native-rotation-cubic-proof
          path: |
            ${{ runner.temp }}/avatar-native-rotation-cubic/**/*.json
            ${{ runner.temp }}/avatar-native-rotation-cubic/**/credits/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
