name: Export one Snow corrective GLB candidate
on:
  push:
    branches: [codex/game-recovery]
    paths:
      - 'scripts/bpy-inspect-avatar-garments.py'
      - 'scripts/bpy-proof-snow-raised-arms.py'
      - 'scripts/bpy-prototype-snow-friendly-face.py'
      - 'scripts/bpy-prototype-snow-smile-width.py'
      - 'scripts/bpy-proof-snow-bent-elbows.py'
      - 'scripts/bpy-proof-snow-natural-wrists.py'
      - 'scripts/bpy-prototype-snow-native-clips.py'
      - 'scripts/bpy-prototype-snow-glb-correctives.py'
      - 'scripts/avatar_glb_corrective_reader.py'
      - 'scripts/bpy-prototype-snow-soft-cloth.py'
      - 'scripts/bpy-render-snow-normalmap-pair.py'
      - 'scripts/bpy-prototype-snow-crewneck.py'
      - 'scripts/ci-restore-snow-native-clips.py'
      - 'scripts/ci-restore-frozen-avatar-sources.py'
      - 'scripts/avatar-render-configs/**'
      - '.github/workflows/avatar-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snow-glb-correctives-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Restore and verify the frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/ci-restore-frozen-avatar-sources.py scripts/ci-restore-snow-native-clips.py scripts/bpy-proof-snow-raised-arms.py scripts/bpy-prototype-snow-friendly-face.py scripts/bpy-prototype-snow-smile-width.py scripts/bpy-proof-snow-bent-elbows.py scripts/bpy-proof-snow-natural-wrists.py scripts/bpy-prototype-snow-native-clips.py scripts/bpy-prototype-snow-glb-correctives.py scripts/avatar_glb_corrective_reader.py scripts/bpy-prototype-snow-soft-cloth.py scripts/bpy-render-snow-normalmap-pair.py scripts/bpy-prototype-snow-crewneck.py scripts/bpy-inspect-avatar-garments.py
          python scripts/ci-restore-frozen-avatar-sources.py --out "$RUNNER_TEMP/avatar-originals" --report "$RUNNER_TEMP/avatar-glb-correctives-candidate/frozen-source-restore.json"
          python scripts/ci-restore-snow-native-clips.py --out "$RUNNER_TEMP/avatar-native-clips-restored" --report "$RUNNER_TEMP/avatar-glb-correctives-candidate/frozen-native-clips-restore.json"
      - name: Prepare the previously reviewed Blender runtime
        run: |
          python -m venv "$RUNNER_TEMP/bpy-runtime"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: bpy==4.5.9 --dest "$RUNNER_TEMP/bpy-wheel"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: numpy==1.26.4 Cython==3.2.4 requests==2.32.5 zstandard==0.25.0
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/ci-prove-bpy.py --wheel-dir "$RUNNER_TEMP/bpy-wheel" --out bpy-proof
      - name: Export the two-mesh Armature-stage corrective GLB pilot
        run: |
          source_root="$RUNNER_TEMP/avatar-originals/originals/sources/assets/characters"
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/bpy-prototype-snow-glb-correctives.py --source-root "$source_root" --derivative-blend "$RUNNER_TEMP/avatar-native-clips-restored/checkpoint/snow-native-clips-candidate.blend" --config scripts/avatar-render-configs/snow-crewneck-prototype.json --out "$RUNNER_TEMP/avatar-glb-correctives-candidate/snow"
      - name: Independently read serialized GLB and native reference bytes
        env:
          CORRECTIVE_OUT: ${{ runner.temp }}/avatar-glb-correctives-candidate/snow
        run: |
          "$RUNNER_TEMP/bpy-runtime/bin/python" - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from avatar_glb_corrective_reader import validate

          out = Path(os.environ["CORRECTIVE_OUT"])
          npz = out / "native_reference.npz"
          def sha(path):
              with path.open("rb") as file:
                  return hashlib.file_digest(file, "sha256").hexdigest()
          before = sha(npz)
          writer_checkpoint_passed = False
          try:
              writer_path = out / "glb-correctives-audit.json"
              if writer_path.stat().st_size > 1048576:
                  raise ValueError("avatar_glb_reader_writer_checkpoint_budget")
              writer = json.loads(writer_path.read_text("utf-8"))
              glb = out / "snow-armature-correctives-prototype.glb"
              reference = out / "native_reference.json"
              written = writer["glb_written"]
              native = writer["native_reference"]
              if not (writer["writer_completed"] is True and writer["readonly_cleanup_passed"] is True
                      and writer["native_reference_hash_recheck"] is True
                      and written["file"] == glb.name and written["bytes"] == glb.stat().st_size
                      and written["sha256"] == sha(glb)
                      and native["npz_bytes"] == npz.stat().st_size
                      and native["npz_sha256"] == before
                      and native["metadata_bytes"] == reference.stat().st_size
                      and native["metadata_sha256"] == sha(reference)):
                  raise ValueError("avatar_glb_reader_writer_checkpoint_incomplete_or_changed")
              writer_checkpoint_passed = True
              report = validate(glb, reference, npz)
          except Exception as error:
              code = error.args[0] if isinstance(error, ValueError) and len(error.args) == 1 and isinstance(error.args[0], str) else None
              if code is None or not code.startswith("avatar_glb_reader_") or len(code) > 160 or not all(c.islower() or c.isdigit() or c == "_" for c in code):
                  code = None
              report = {"reader": "independent_serialized_glb_correctives_v1",
                        "summary": {"passed": False, "error_type": type(error).__name__[:80],
                                    "error_code": code, "production_glb_approved": False,
                                    "browser_fidelity_approved": False}}
          after = sha(npz)
          summary = report["summary"]
          summary["writer_checkpoint_passed"] = writer_checkpoint_passed
          summary["reference_npz_sha256_before"] = before
          summary["reference_npz_sha256_after"] = after
          summary["reference_npz_unchanged_during_readback"] = before == after
          summary["passed"] = bool(summary["passed"] and writer_checkpoint_passed and before == after)
          full = json.dumps(report, ensure_ascii=False, sort_keys=True, allow_nan=False, separators=(",", ":")).encode("utf-8")
          small = json.dumps(summary, ensure_ascii=False, sort_keys=True, allow_nan=False, separators=(",", ":")).encode("utf-8")
          if len(full) > 1048576 or len(small) > 24576:
              raise ValueError("independent_reader_output_byte_budget_exceeded")
          (out / "independent-reader-audit.json").write_bytes(full)
          print("SNOW_GLB_CORRECTIVES_READER " + small.decode("utf-8"), flush=True)
          raise SystemExit(0 if summary["passed"] else 1)
          PY
      - name: Preserve the actual GLB candidate, references, credits and runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-glb-correctives-candidate
          path: |
            ${{ runner.temp }}/avatar-glb-correctives-candidate/
            bpy-proof/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Preserve the small JSON proof without GLB or NPZ payloads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-glb-correctives-proof
          path: |
            ${{ runner.temp }}/avatar-glb-correctives-candidate/**/*.json
            ${{ runner.temp }}/avatar-glb-correctives-candidate/**/credits/**
            bpy-proof/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
