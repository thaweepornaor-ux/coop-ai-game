name: Capture one Snow native rotation derivative packet
on:
  push:
    branches: [codex/game-recovery]
    paths:
      - 'scripts/bpy-capture-snow-rotation-derivatives.py'
      - 'scripts/ci-restore-snow-factor48-input.py'
      - 'scripts/avatar-render-configs/snow-native-rotation-derivative-plan.json'
      - '.github/workflows/avatar-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ROTATION_CAPTURE_PACKET: '0'
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snow-native-rotation-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile capture and imported helpers; restore pinned read-only inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/bpy-capture-snow-rotation-derivatives.py scripts/ci-restore-frozen-avatar-sources.py scripts/ci-restore-snow-native-clips.py scripts/ci-restore-snow-factor48-input.py scripts/ci-prove-bpy.py scripts/bpy-export-snow-native48-correctives.py scripts/bpy-export-snow-cached-correctives.py scripts/bpy-prototype-snow-glb-correctives.py scripts/bpy-proof-snow-raised-arms.py scripts/bpy-prototype-snow-friendly-face.py scripts/bpy-prototype-snow-smile-width.py scripts/bpy-proof-snow-bent-elbows.py scripts/bpy-proof-snow-natural-wrists.py scripts/bpy-prototype-snow-native-clips.py scripts/bpy-prototype-snow-soft-cloth.py scripts/bpy-render-snow-normalmap-pair.py scripts/bpy-prototype-snow-crewneck.py scripts/bpy-inspect-avatar-garments.py
          python scripts/ci-restore-frozen-avatar-sources.py --out "$RUNNER_TEMP/avatar-originals" --report "$RUNNER_TEMP/avatar-rotation-native-packet/frozen-source-restore.json"
          python scripts/ci-restore-snow-native-clips.py --out "$RUNNER_TEMP/avatar-native-clips-restored" --report "$RUNNER_TEMP/avatar-rotation-native-packet/frozen-native-clips-restore.json"
          python scripts/ci-restore-snow-factor48-input.py --out "$RUNNER_TEMP/avatar-factor48-input" --report "$RUNNER_TEMP/avatar-rotation-native-packet/frozen-factor48-input-restore.json"
      - name: Prepare the previously reviewed Blender runtime
        run: |
          python -m venv "$RUNNER_TEMP/bpy-runtime"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: bpy==4.5.9 --dest "$RUNNER_TEMP/bpy-wheel"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: numpy==1.26.4 Cython==3.2.4 requests==2.32.5 zstandard==0.25.0
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/ci-prove-bpy.py --wheel-dir "$RUNNER_TEMP/bpy-wheel" --out bpy-proof
      - name: Capture exactly one predeclared packet without rewriting the GLB
        run: |
          source_root="$RUNNER_TEMP/avatar-originals/originals/sources/assets/characters"
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/bpy-capture-snow-rotation-derivatives.py --source-root "$source_root" --derivative-blend "$RUNNER_TEMP/avatar-native-clips-restored/checkpoint/snow-native-clips-candidate.blend" --config scripts/avatar-render-configs/snow-crewneck-prototype.json --baseline-root "$RUNNER_TEMP/avatar-factor48-input/checkpoint" --plan scripts/avatar-render-configs/snow-native-rotation-derivative-plan.json --packet "$ROTATION_CAPTURE_PACKET" --out "$RUNNER_TEMP/avatar-rotation-native-packet/snow"
      - name: Preserve the complete native capture packet and runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-rotation-native-packet-${{ env.ROTATION_CAPTURE_PACKET }}
          path: |
            ${{ runner.temp }}/avatar-rotation-native-packet/
            bpy-proof/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Preserve only JSON proof and credits without NPZ payloads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-rotation-native-proof-${{ env.ROTATION_CAPTURE_PACKET }}
          path: |
            ${{ runner.temp }}/avatar-rotation-native-packet/**/*.json
            ${{ runner.temp }}/avatar-rotation-native-packet/**/credits/**
            bpy-proof/**/*.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
