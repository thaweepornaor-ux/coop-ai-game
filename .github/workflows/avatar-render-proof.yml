name: Test one offline Snow CUBICSPLINE GLB candidate
on:
  push:
    branches: [codex/game-recovery]
    paths:
      - 'scripts/ci-restore-frozen-avatar-sources.py'
      - 'scripts/ci-restore-snow-cubic-input.py'
      - 'scripts/ci-prototype-snow-cubic-glb.py'
      - 'scripts/avatar_glb_cubic_reader.py'
      - '.github/workflows/avatar-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snow-glb-cubic-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile and restore only frozen GLB and native reference bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/ci-restore-frozen-avatar-sources.py scripts/ci-restore-snow-cubic-input.py scripts/ci-prototype-snow-cubic-glb.py scripts/avatar_glb_cubic_reader.py
          python scripts/ci-restore-snow-cubic-input.py --out "$RUNNER_TEMP/avatar-cubic-input-restored" --report "$RUNNER_TEMP/avatar-glb-cubic-candidate/frozen-cubic-input-restore.json"
      - name: Prepare NumPy only, without Blender or original avatar restoration
        run: |
          python -m venv "$RUNNER_TEMP/numpy-runtime"
          "$RUNNER_TEMP/numpy-runtime/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: numpy==1.26.4
      - name: Rewrite one deterministic cubic candidate from authored keys only
        run: |
          "$RUNNER_TEMP/numpy-runtime/bin/python" scripts/ci-prototype-snow-cubic-glb.py --input-root "$RUNNER_TEMP/avatar-cubic-input-restored/checkpoint" --out "$RUNNER_TEMP/avatar-glb-cubic-candidate/snow"
      - name: Independently read serialized GLB and native reference bytes
        env:
          CORRECTIVE_OUT: ${{ runner.temp }}/avatar-glb-cubic-candidate/snow
          CUBIC_BASELINE: ${{ runner.temp }}/avatar-cubic-input-restored/checkpoint/source.glb
        run: |
          "$RUNNER_TEMP/numpy-runtime/bin/python" - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from avatar_glb_cubic_reader import validate

          out = Path(os.environ["CORRECTIVE_OUT"])
          npz = out / "native_reference.npz"
          def sha(path):
              with path.open("rb") as file:
                  return hashlib.file_digest(file, "sha256").hexdigest()
          before = sha(npz)
          writer_checkpoint_passed = False
          try:
              writer_path = out / "glb-correctives-audit.json"
              if writer_path.stat().st_size > 1048576:
                  raise ValueError("avatar_glb_reader_writer_checkpoint_budget")
              writer = json.loads(writer_path.read_text("utf-8"))
              glb = out / "snow-armature-cubic-prototype.glb"
              reference = out / "native_reference.json"
              written = writer["glb_written"]
              native = writer["native_reference"]
              if not (writer["writer_completed"] is True and writer["readonly_cleanup_passed"] is True
                      and writer["native_reference_hash_recheck"] is True
                      and written["file"] == glb.name and written["bytes"] == glb.stat().st_size
                      and written["sha256"] == sha(glb)
                      and native["npz_bytes"] == npz.stat().st_size
                      and native["npz_sha256"] == before
                      and native["metadata_bytes"] == reference.stat().st_size
                      and native["metadata_sha256"] == sha(reference)):
                  raise ValueError("avatar_glb_reader_writer_checkpoint_incomplete_or_changed")
              writer_checkpoint_passed = True
              report = validate(glb, reference, npz, Path(os.environ["CUBIC_BASELINE"]))
          except Exception as error:
              code = error.args[0] if isinstance(error, ValueError) and len(error.args) == 1 and isinstance(error.args[0], str) else None
              if code is None or not code.startswith("avatar_glb_reader_") or len(code) > 160 or not all(c.islower() or c.isdigit() or c == "_" for c in code):
                  code = None
              report = {"reader": "independent_serialized_glb_cubic_correctives_v1",
                        "summary": {"passed": False, "error_type": type(error).__name__[:80],
                                    "error_code": code, "production_glb_approved": False,
                                    "browser_fidelity_approved": False}}
          after = sha(npz)
          summary = report["summary"]
          summary["writer_checkpoint_passed"] = writer_checkpoint_passed
          summary["reference_npz_sha256_before"] = before
          summary["reference_npz_sha256_after"] = after
          summary["reference_npz_unchanged_during_readback"] = before == after
          summary["passed"] = bool(summary["passed"] and writer_checkpoint_passed and before == after)
          full = json.dumps(report, ensure_ascii=False, sort_keys=True, allow_nan=False, separators=(",", ":")).encode("utf-8")
          small = json.dumps(summary, ensure_ascii=False, sort_keys=True, allow_nan=False, separators=(",", ":")).encode("utf-8")
          if len(full) > 1048576 or len(small) > 24576:
              raise ValueError("independent_reader_output_byte_budget_exceeded")
          (out / "independent-reader-audit.json").write_bytes(full)
          print("SNOW_GLB_CUBIC_READER " + small.decode("utf-8"), flush=True)
          raise SystemExit(0 if summary["passed"] else 1)
          PY
      - name: Preserve the actual cubic GLB, native references and credits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-glb-cubic-candidate
          path: ${{ runner.temp }}/avatar-glb-cubic-candidate/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Preserve the small JSON proof without GLB or NPZ payloads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-glb-cubic-proof
          path: |
            ${{ runner.temp }}/avatar-glb-cubic-candidate/**/*.json
            ${{ runner.temp }}/avatar-glb-cubic-candidate/**/credits/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
