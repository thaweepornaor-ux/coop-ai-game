name: Inspect one Snow segment-fidelity candidate
on:
  push:
    branches: [codex/game-recovery]
    paths:
      - 'scripts/bpy-inspect-avatar-garments.py'
      - 'scripts/bpy-proof-snow-raised-arms.py'
      - 'scripts/bpy-prototype-snow-friendly-face.py'
      - 'scripts/bpy-prototype-snow-smile-width.py'
      - 'scripts/bpy-proof-snow-bent-elbows.py'
      - 'scripts/bpy-proof-snow-natural-wrists.py'
      - 'scripts/bpy-prototype-snow-native-clips.py'
      - 'scripts/bpy-proof-snow-segment-fidelity.py'
      - 'scripts/bpy-prototype-snow-soft-cloth.py'
      - 'scripts/bpy-render-snow-normalmap-pair.py'
      - 'scripts/bpy-prototype-snow-crewneck.py'
      - 'scripts/ci-restore-snow-native-clips.py'
      - 'scripts/ci-restore-frozen-avatar-sources.py'
      - 'scripts/avatar-render-configs/**'
      - '.github/workflows/avatar-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snow-segment-fidelity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Restore and verify the frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/ci-restore-frozen-avatar-sources.py scripts/ci-restore-snow-native-clips.py scripts/bpy-proof-snow-raised-arms.py scripts/bpy-prototype-snow-friendly-face.py scripts/bpy-prototype-snow-smile-width.py scripts/bpy-proof-snow-bent-elbows.py scripts/bpy-proof-snow-natural-wrists.py scripts/bpy-prototype-snow-native-clips.py scripts/bpy-proof-snow-segment-fidelity.py scripts/bpy-prototype-snow-soft-cloth.py scripts/bpy-render-snow-normalmap-pair.py scripts/bpy-prototype-snow-crewneck.py scripts/bpy-inspect-avatar-garments.py
          python scripts/ci-restore-frozen-avatar-sources.py --out "$RUNNER_TEMP/avatar-originals" --report "$RUNNER_TEMP/avatar-segment-fidelity/frozen-source-restore.json"
          python scripts/ci-restore-snow-native-clips.py --out "$RUNNER_TEMP/avatar-native-clips-restored" --report "$RUNNER_TEMP/avatar-segment-fidelity/frozen-native-clips-restore.json"
      - name: Prepare the previously reviewed Blender runtime
        run: |
          python -m venv "$RUNNER_TEMP/bpy-runtime"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: bpy==4.5.9 --dest "$RUNNER_TEMP/bpy-wheel"
          "$RUNNER_TEMP/bpy-runtime/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: numpy==1.26.4 Cython==3.2.4 requests==2.32.5 zstandard==0.25.0
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/ci-prove-bpy.py --wheel-dir "$RUNNER_TEMP/bpy-wheel" --out bpy-proof
      - name: Compare segment reconstruction with the native Armature stage
        run: |
          source_root="$RUNNER_TEMP/avatar-originals/originals/sources/assets/characters"
          "$RUNNER_TEMP/bpy-runtime/bin/python" scripts/bpy-proof-snow-segment-fidelity.py --source-root "$source_root" --derivative-blend "$RUNNER_TEMP/avatar-native-clips-restored/checkpoint/snow-native-clips-candidate.blend" --config scripts/avatar-render-configs/snow-crewneck-prototype.json --out "$RUNNER_TEMP/avatar-segment-fidelity/snow"
      - name: Preserve segment-fidelity reports, credits and runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-snow-segment-fidelity-proof
          path: |
            ${{ runner.temp }}/avatar-segment-fidelity/**/*.json
            ${{ runner.temp }}/avatar-segment-fidelity/**/credits/**
            bpy-proof/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
