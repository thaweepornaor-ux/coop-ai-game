name: Build NHK Solar TV APK
on:
  push:
    branches: [nhk-solar-tv-apk-build]
    paths:
      - 'solar-tv-apk/**'
      - '.github/workflows/nhk-solar-tv-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile actual Android TV application
        working-directory: solar-tv-apk
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NHK-Solar-TV-APK
          path: solar-tv-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
