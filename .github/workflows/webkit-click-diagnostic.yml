name: WebKit click diagnostic
on:
  push:
    branches: [main, codex/game-recovery]
    paths:
      - 'scripts/diagnose-webkit-click.mjs'
      - '.github/workflows/webkit-click-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-click-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      COOP_EPHEMERAL_D1: '1'
      COOP_PREVIEW_URL: 'http://127.0.0.1:4173'
      COOP_BROWSER_DIAGNOSTIC_CASE: 'webkit-wardrobe-only-1280'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify locked framework worker entry
        run: node --input-type=module -e "console.log(import.meta.resolve('vinext/server/app-router-entry'))"
      - name: Migrate disposable local D1
        run: corepack pnpm exec wrangler d1 migrations apply DB --local --config wrangler.ci.jsonc --persist-to .wrangler/ci-state
      - name: Build genuine App Router preview
        run: corepack pnpm exec vite build --config vite.ci.config.ts
      - name: Install reviewed browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/coop-browser-proof" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.64.0
          node "$RUNNER_TEMP/coop-browser-proof/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Exercise real host and learner browsers
        env:
          COOP_PLAYWRIGHT_DIR: ${{ runner.temp }}/coop-browser-proof
        run: |
          corepack pnpm exec vite preview --config vite.ci.config.ts --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/coop-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 60 "$RUNNER_TEMP/coop-preview.log"
            exit 1
          fi
          node scripts/diagnose-webkit-click.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-click-diagnostic
          path: browser-proof/
          if-no-files-found: ignore
          retention-days: 7
