<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OBEYA Video Player</title>
<link rel="icon" href="favicon.ico">
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;--blue:#6fc6ff;--silver:#d9e6f4;--navy:#070e1b}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#f3f8ff}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
#stage{width:100%;height:100%;position:relative;background:#030711;overflow:hidden;user-select:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:auto;transition:opacity .32s ease;z-index:5}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,8,21,.32),transparent 55%),linear-gradient(0deg,rgba(3,8,22,.90),rgba(3,8,22,.15) 38%,transparent 62%);pointer-events:none}
#brand{z-index:1;margin:clamp(28px,4vw,74px);display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#brand .kicker{font-size:clamp(10px,.75vw,15px);letter-spacing:.32em;font-weight:700;color:#91caff}
#brand .name{font-size:clamp(42px,5vw,112px);font-weight:650;letter-spacing:.17em;line-height:1;filter:drop-shadow(0 0 20px rgba(70,160,255,.28));color:#f3f6ff}
#title-bottom{z-index:1;display:flex;flex-direction:column;gap:clamp(20px,3vw,45px);align-items:center;padding:20px 20px clamp(45px,7vh,100px)}
#tagline{font-size:clamp(11px,1.1vw,19px);font-weight:500;letter-spacing:.34em;color:#c9d7e6;text-shadow:0 2px 9px #000}
#start{min-width:min(350px,75vw);height:clamp(70px,8vh,100px);padding:0 48px;border:1px solid rgba(143,222,255,.75);border-radius:15px;background:linear-gradient(135deg,rgba(10,45,84,.97),rgba(20,99,158,.91));color:#fff;box-shadow:0 0 25px rgba(18,135,227,.27),inset 0 1px 0 rgba(255,255,255,.25);display:flex;gap:22px;align-items:center;justify-content:center;font-size:clamp(20px,1.5vw,27px);letter-spacing:.19em;font-weight:750;transition:transform .2s,box-shadow .2s,background .2s}
#start svg{width:26px;height:26px;fill:currentColor}
#start:hover{transform:translateY(-3px);box-shadow:0 0 45px rgba(29,162,255,.52)}
#stage:not(.on-title) #title{opacity:0;pointer-events:none;visibility:hidden}
#controls{position:absolute;inset:auto 0 0;z-index:8;padding:clamp(16px,2.2vw,42px) clamp(16px,3.2vw,62px) clamp(18px,3vw,52px);background:linear-gradient(0deg,rgba(3,10,24,.97),rgba(3,10,24,.72) 64%,transparent);transition:opacity .28s ease,transform .28s ease;opacity:1}
.on-title #controls{display:none}
#stage.hide-ui:not(.on-title) #controls{opacity:0;transform:translateY(24px);pointer-events:none}
#topline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:clamp(13px,1.5vh,24px);font-size:clamp(13px,.95vw,18px);font-weight:650;letter-spacing:.09em;color:#d5e3ef}
#video-title{font-size:clamp(15px,1.2vw,22px);color:#f7fbff}
#timeline{display:flex;align-items:center;gap:clamp(10px,1.5vw,22px);margin-bottom:clamp(14px,2.2vh,28px)}
#seek{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:8px;border-radius:20px;outline:0;border:1px solid rgba(255,255,255,.12);background:linear-gradient(to right,#80d3ff 0%,#80d3ff var(--pct,0%),rgba(196,215,236,.31) var(--pct,0%),rgba(196,215,236,.31) 100%);cursor:pointer}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:23px;height:23px;border-radius:50%;border:3px solid #e6f7ff;background:#248bd0;box-shadow:0 0 13px rgba(83,188,255,.65)}
#seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:3px solid #e6f7ff;background:#248bd0}
#times{white-space:nowrap;font-size:clamp(13px,.9vw,18px);font-variant-numeric:tabular-nums;color:#e0e8ef}
#buttons{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(7px,.9vw,16px)}
.ctrl{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:clamp(48px,3.5vw,66px);height:clamp(46px,3.7vw,64px);padding:0 clamp(13px,1.2vw,23px);border-radius:10px;border:1px solid rgba(165,209,242,.22);color:#f0f6fc;background:rgba(47,70,100,.44);transition:background .2s,transform .2s,border-color .2s;white-space:nowrap;font-weight:650;font-size:clamp(12px,.85vw,16px)}
.ctrl:hover{background:rgba(47,124,183,.72);border-color:rgba(153,216,255,.68);transform:translateY(-2px)}
.ctrl svg{width:clamp(20px,1.5vw,27px);height:clamp(20px,1.5vw,27px);stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ctrl.primary{background:linear-gradient(120deg,#1664a1,#298cc7);border-color:#76c5f9}
.ctrl.danger{border-color:rgba(238,151,166,.40)}
.ctrl .alternate{display:none}
.ctrl.is-alternate .main{display:none}
.ctrl.is-alternate .alternate{display:inline-block}
.ctrl.is-alternate .main-text{display:none}
.ctrl:not(.is-alternate) .alt-text{display:none}
#hint{position:absolute;top:18px;right:20px;opacity:0;pointer-events:none;background:rgba(4,13,29,.9);border:1px solid rgba(114,200,249,.5);padding:11px 17px;border-radius:9px;color:#fff;z-index:20;transition:opacity .2s}
#hint.show{opacity:1}
svg.icon-defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:980px){#buttons{justify-content:center}.ctrl .label{display:none}#stage #controls{padding:13px 15px 20px}#topline{margin-bottom:11px}#timeline{margin-bottom:14px}}
@media (max-height:530px){#brand{margin:18px}#brand .name{font-size:40px}#title-bottom{padding-bottom:18px;gap:12px}#start{height:58px}#tagline{display:none}#controls{padding-top:10px;padding-bottom:10px}.ctrl{height:40px;min-width:42px}#timeline{margin-bottom:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7V5Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l6 6M22 9l-6 6"/></symbol>
<symbol id="i-rewind" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/><text x="7" y="15.7" fill="currentColor" stroke="none" font-size="8" font-weight="bold">15</text></symbol>
<symbol id="i-forward" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/><text x="7" y="15.7" fill="currentColor" stroke="none" font-size="8" font-weight="bold">15</text></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></symbol>
<symbol id="i-min" viewBox="0 0 24 24"><path d="M3 9h6V3M21 9h-6V3M21 15h-6v6M3 15h6v6"/></symbol>
<symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H4v16h6M14 16l4-4-4-4M8 12h10"/></symbol>
</svg>
<main id="stage" class="on-title" aria-label="OBEYA video player">
 <video id="video" preload="auto" playsinline disablepictureinpicture aria-label="OBEYA presentation video"></video>
 <section id="title" aria-label="Title screen">
  <div id="brand"><span class="kicker">PRESENTATION EXPERIENCE</span><span class="name">OBEYA</span></div>
  <div id="title-bottom"><span id="tagline">VISION · PEOPLE · EXCELLENCE</span><button id="start" type="button"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg> START</button></div>
 </section>
 <section id="controls" aria-label="Video controls">
  <div id="topline"><span id="video-title">OBEYA</span><span>VIDEO PLAYER</span></div>
  <div id="timeline"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek video"><span id="times">00:00 / --:--</span></div>
  <div id="buttons">
   <div class="group">
    <button id="toggle" class="ctrl primary" title="Pause / Resume" aria-label="Pause or resume video"><svg class="main"><use href="#i-pause"/></svg><svg class="alternate"><use href="#i-play"/></svg><span class="label main-text">PAUSE</span><span class="label alt-text">RESUME</span></button>
    <button id="stop" class="ctrl" title="Stop" aria-label="Stop video"><svg><use href="#i-stop"/></svg><span class="label">STOP</span></button>
    <button id="backward" class="ctrl" title="Backward 15 seconds" aria-label="Backward 15 seconds"><svg><use href="#i-rewind"/></svg><span class="label">−15s</span></button>
    <button id="forward" class="ctrl" title="Forward 15 seconds" aria-label="Forward 15 seconds"><svg><use href="#i-forward"/></svg><span class="label">+15s</span></button>
    <button id="mute" class="ctrl" title="Mute / Unmute" aria-label="Mute or unmute"><svg class="main"><use href="#i-volume"/></svg><svg class="alternate"><use href="#i-mute"/></svg><span class="label main-text">MUTE</span><span class="label alt-text">UNMUTE</span></button>
   </div>
   <div class="group">
    <button id="fullscreen" class="ctrl" title="Fullscreen" aria-label="Go fullscreen"><svg><use href="#i-full"/></svg><span class="label">FULLSCREEN</span></button>
    <button id="minimize" class="ctrl" title="Exit fullscreen" aria-label="Exit fullscreen"><svg><use href="#i-min"/></svg><span class="label">MINIMIZE</span></button>
    <button id="exit" class="ctrl danger" title="Back to title" aria-label="Exit to title"><svg><use href="#i-exit"/></svg><span class="label">EXIT</span></button>
   </div>
  </div>
 </section>
 <aside id="hint" role="status" aria-live="polite"></aside>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'), video=$('video'), seek=$('seek'), times=$('times'), controls=$('controls');
var idleTimer=0, noticeTimer=0, seeking=false;
video.src=window.location.protocol==='file:'?'OBEYA.mp4':'video.mp4';
video.load();
function fmt(s){
 if(!isFinite(s)||s<0)return '--:--';
 s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
 var two=function(n){return String(n).padStart(2,'0')};
 return h?String(h)+':'+two(m)+':'+two(ss):two(m)+':'+two(ss);
}
function notify(s){var h=$('hint');h.textContent=s;h.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(function(){h.classList.remove('show')},3200)}
function render(){
 var d=video.duration||0,c=video.currentTime||0;
 times.textContent=fmt(c)+' / '+fmt(d);
 if(!seeking){var v=d?Math.min(1000,Math.round(c/d*1000)):0;seek.value=String(v);seek.style.setProperty('--pct',(v/10)+'%')}
 $('toggle').classList.toggle('is-alternate',video.paused);
 $('mute').classList.toggle('is-alternate',video.muted);
}
function hideLater(){
 clearTimeout(idleTimer);
 if(stage.classList.contains('on-title')||video.paused||controls.matches(':hover'))return;
 idleTimer=setTimeout(function(){if(!video.paused&&!controls.matches(':hover'))stage.classList.add('hide-ui')},2600);
}
function showUI(){stage.classList.remove('hide-ui');hideLater()}
function full(){if(!document.fullscreenElement&&stage.requestFullscreen){var p=stage.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(function(){notify('Fullscreen is not available in this browser')})}}
function unfull(){if(document.fullscreenElement&&document.exitFullscreen){var p=document.exitFullscreen();if(p&&p.catch)p.catch(function(){})}}
function play(){var p=video.play();if(p&&p.catch)p.catch(function(){notify('Cannot play video. Check the original MP4 format.')});render();hideLater()}
function begin(){stage.classList.remove('on-title');stage.classList.remove('hide-ui');video.pause();try{video.currentTime=0}catch(e){};full();play();showUI()}
function title(){video.pause();try{video.currentTime=0}catch(e){};unfull();stage.classList.remove('hide-ui');stage.classList.add('on-title');clearTimeout(idleTimer);render()}
function stop(){video.pause();try{video.currentTime=0}catch(e){};showUI();render()}
function skip(sec){var max=isFinite(video.duration)?video.duration:Infinity;try{video.currentTime=Math.min(max,Math.max(0,(video.currentTime||0)+sec))}catch(e){};showUI();render()}
function toggle(){video.paused?play():video.pause();showUI();render()}
$('start').addEventListener('click',begin);
$('toggle').addEventListener('click',toggle);
$('stop').addEventListener('click',stop);
$('backward').addEventListener('click',function(){skip(-15)});
$('forward').addEventListener('click',function(){skip(15)});
$('mute').addEventListener('click',function(){video.muted=!video.muted;render();showUI()});
$('fullscreen').addEventListener('click',function(){full();showUI()});
$('minimize').addEventListener('click',function(){unfull();showUI()});
$('exit').addEventListener('click',title);
seek.addEventListener('input',function(){seeking=true;seek.style.setProperty('--pct',(Number(seek.value)/10)+'%');if(isFinite(video.duration)){try{video.currentTime=video.duration*(Number(seek.value)/1000)}catch(e){}}render();showUI()});
seek.addEventListener('change',function(){seeking=false;render();showUI()});
stage.addEventListener('pointermove',showUI);
stage.addEventListener('pointerdown',showUI);
controls.addEventListener('mouseenter',function(){clearTimeout(idleTimer);stage.classList.remove('hide-ui')});
controls.addEventListener('mouseleave',hideLater);
document.addEventListener('fullscreenchange',showUI);
video.addEventListener('loadedmetadata',render);
video.addEventListener('loadeddata',render);
video.addEventListener('timeupdate',render);
video.addEventListener('play',function(){render();hideLater()});
video.addEventListener('pause',function(){showUI();render()});
video.addEventListener('ended',title);
video.addEventListener('error',function(){notify('Video could not be loaded. The MP4 must be embedded in the launcher, or next to this HTML file.')});
document.addEventListener('keydown',function(e){
 if(e.target===seek)return;
 if(stage.classList.contains('on-title')){if(e.key==='Enter'&&e.target===document.body){e.preventDefault();begin()}return}
 if(e.code==='Space'){e.preventDefault();toggle()}
 else if(e.key==='ArrowLeft'){e.preventDefault();skip(-15)}
 else if(e.key==='ArrowRight'){e.preventDefault();skip(15)}
 else if(e.key==='m'||e.key==='M'){video.muted=!video.muted;render();showUI()}
 else if(e.key==='f'||e.key==='F'){full();showUI()}
});
if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){
 var ping=function(){fetch('/ping',{cache:'no-store'}).catch(function(){})};
 ping();setInterval(ping,10000);
}
render();
})();
</script>
</body>
</html>
